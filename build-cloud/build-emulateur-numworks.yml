# .github/workflows/build-emulateur-numworks.yml
#
# Compile le simulateur NumWorks (système Epsilon) dans le cloud GitHub :
#   - epsilon.html  : émulateur web autonome (1 fichier, s'ouvre dans un navigateur)
#   - epsilon.exe   : émulateur natif Windows 64 bits (+ DLLs, dans un .zip)
#   - epsilon.bin   : émulateur natif Linux
#
# Utilisation :
#   1. Fork de https://github.com/numworks/epsilon
#   2. Copier ce fichier dans .github/workflows/ du fork, commit/push
#   3. Onglet "Actions" -> autoriser les workflows -> "Émulateur NumWorks" -> "Run workflow"
#   4. Récupérer les fichiers dans "Artifacts" en bas de la page du run
#
# Basé sur le CI officiel NumWorks (.github/workflows/epsilon-ci.yml).

name: Émulateur NumWorks

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  web:
    name: Web (epsilon.html)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances hôte
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git imagemagick \
            libpng-dev libjpeg-dev pkg-config python3 python3-pip nodejs npm

      - name: Version Emscripten (depuis .emsdk-version)
        run: echo "EMSDK_VERSION=$(cat .emsdk-version)" >> "$GITHUB_ENV"

      - name: Installer Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Compiler
        run: |
          emcc --version
          make -C epsilon PLATFORM=simulator TARGET=web ASSERTIONS=1 -j$(nproc) epsilon.html

      - name: Localiser la sortie
        id: out
        run: |
          f=$(find epsilon/output -name 'epsilon.html' | head -n1)
          echo "Trouvé : $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: emulateur-web
          path: ${{ steps.out.outputs.dir }}/epsilon.*
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  windows:
    name: Windows (epsilon.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-imagemagick
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python

      - uses: actions/checkout@v4

      - name: Compiler
        run: |
          gcc --version
          make -C epsilon PLATFORM=simulator ASSERTIONS=1 -j$(nproc) epsilon.exe

      - name: Empaqueter epsilon.exe + DLLs
        run: |
          f=$(find epsilon/output -name 'epsilon.exe' | head -n1)
          echo "Trouvé : $f"
          mkdir -p dist
          cp "$f" dist/
          # copier les DLLs mingw dont dépend l'exécutable
          for dll in $(ldd "$f" | grep -i '/mingw64/' | awk '{print $3}'); do
            cp -v "$dll" dist/ || true
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: emulateur-windows
          path: dist/*
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  linux:
    name: Linux (epsilon.bin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git imagemagick \
            libfreetype6-dev libjpeg-dev libpng-dev libx11-dev libxext-dev \
            pkg-config python3 python3-pip

      - name: Compiler
        run: make -C epsilon PLATFORM=simulator ASSERTIONS=1 -j$(nproc) epsilon.bin

      - name: Localiser la sortie
        id: out
        run: |
          f=$(find epsilon/output -name 'epsilon.bin' | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: emulateur-linux
          path: ${{ steps.out.outputs.dir }}/epsilon.bin
          if-no-files-found: error
